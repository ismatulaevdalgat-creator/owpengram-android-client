name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK and NDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"
      - name: API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(APP_ID *= *)[0-9]+;/\1${API_ID};/" $F
          sed -i -E "s/(APP_HASH *= *)\"[^\"]*\";/\1\"${API_HASH}\";/" $F
          grep -n "APP_ID\|APP_HASH" $F | sed -E 's/"[^"]*"/"***"/'
      - name: Create keystore
        run: |
          get() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2-; }
          ALIAS=$(get RELEASE_KEY_ALIAS); ALIAS=${ALIAS:-androidkey}
          SP=$(get RELEASE_STORE_PASSWORD); SP=${SP:-android}
          KP=$(get RELEASE_KEY_PASSWORD); KP=${KP:-android}
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMe
